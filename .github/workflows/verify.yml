name: Auralis verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  native-reference-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository only
        shell: bash
        run: |
          git init auralis
          git -C auralis remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C auralis fetch --depth=1 origin "${GITHUB_SHA}"
          git -C auralis checkout --detach FETCH_HEAD
      - name: Compile native DSP and run reference tests
        run: |
          cmake -S auralis/app/src/main/cpp -B auralis/build-native -DCMAKE_BUILD_TYPE=Release
          cmake --build auralis/build-native --parallel 2
          ctest --test-dir auralis/build-native --output-on-failure --verbose

  android-debug-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository only
        shell: bash
        run: |
          git init auralis
          git -C auralis remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C auralis fetch --depth=1 origin "${GITHUB_SHA}"
          git -C auralis checkout --detach FETCH_HEAD
      - name: Install supported JDK 17
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"
          echo "/usr/lib/jvm/java-17-openjdk-amd64/bin" >> "$GITHUB_PATH"
      - name: Install Android SDK components
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Verify Auralis version metadata
        run: |
          grep -q "versionCode 5" auralis/app/build.gradle
          grep -q "versionName '1.2.2'" auralis/app/build.gradle
      - name: Install Gradle distribution
        run: |
          curl --retry 3 --retry-delay 2 -fsSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
      - name: Assemble Android player
        run: |
          java -version
          /tmp/gradle-8.7/bin/gradle --no-daemon -p auralis assembleDebug testDebugUnitTest

      - name: Verify APK and record build identity
        shell: bash
        run: |
          set -euo pipefail
          APK=auralis/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          sha256sum "$APK" | tee auralis/AURALIS-SHA256SUMS.txt
          cat > auralis/AURALIS-BUILD-INFO.txt <<INFO
          Auralis 1.2.2 responsiveness and UI performance
          Source: ${GITHUB_SHA}
          Application ID: com.auralis
          Version: 1.2.2 (versionCode 5)
          Variant: debug
          Build task: assembleDebug
          Test task: testDebugUnitTest
          INFO
      - name: Upload verified debug APK
        uses: actions/upload-artifact@v4
        with:
          name: auralis-1.2.2-responsive-debug-${{ github.sha }}
          path: |
            auralis/app/build/outputs/apk/debug/app-debug.apk
            auralis/AURALIS-BUILD-INFO.txt
            auralis/AURALIS-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
